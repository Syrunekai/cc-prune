[project]
name = "cc-prune"
version = "0.5.0"
description = "Surgical context recovery for Claude Code sessions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cc-prune = "ccprune.cli:main"

[project.gui-scripts]
cc-prune-gui = "ccprune.gui:main"

[project.optional-dependencies]
gui = [
    "pyside6>=6.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ccprune"

[tool.pytest.ini_options]
testpaths = ["tests"]
